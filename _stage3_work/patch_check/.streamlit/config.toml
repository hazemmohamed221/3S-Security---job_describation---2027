[theme]
primaryColor = "#2563eb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
port = 8501
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false

[runner]
magicEnabled = false

